body {
    margin: 0;
    padding: 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #111;
    color: #f5f5f5;
}

/* NAVBAR FIXE LUXE */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 20px 20px; /* padding réduit */
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(17,17,17,0.9);
    backdrop-filter: blur(6px);
    z-index: 100;
}

.logo {
    font-size: 22px;
    letter-spacing: 3px;
    text-decoration: none;
    color: #f5f5f5;
}

/* MENU DROPDOWN */
.dropdown {
    position: relative;
}

.dropdown-button {
    cursor: pointer;
    letter-spacing: 1px;
    padding: 8px 20px; /* suffisant pour afficher le texte entier */
    white-space: nowrap;
    font-size: 16px;
}

.dropdown-menu {
    position: absolute;
    top: 120%;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
    border-radius: 12px;
    padding: 8px 0;
    min-width: 160px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    z-index: 10;
    white-space: nowrap;
}

.dropdown-menu a {
    display: block;
    padding: 10px 20px;
    color: white;
    text-decoration: none;
}

.dropdown-menu a:hover {
    background: rgba(255,255,255,0.05);
}

.dropdown.active .dropdown-menu {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(5px);
}
