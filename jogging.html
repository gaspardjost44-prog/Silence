<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SILENCE – Jogging</title>

<style>
body {
    margin: 0;
    padding: 30px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #111;
    color: #f5f5f5;
    text-align: center;
}

.back {
    display: block;
    text-align: left;
    font-size: 22px;
    text-decoration: none;
    color: #f5f5f5;
    margin-bottom: 30px;
}

h1 {
    font-size: 42px;
}

p {
    opacity: 0.8;
}

/* MENU */
.dropdown {
    position: relative;
    display: inline-block;
    margin-top: 30px;
}

.dropdown-button {
    padding: 12px 32px;
    background: #111;
    color: white;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.dropdown-button:hover {
    box-shadow: 0 0 12px rgba(255,255,255,0.4);
    transform: translateY(-2px);
}

.dropdown-menu {
    position: absolute;
    top: 120%;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
    border-radius: 15px;
    padding: 8px 0;
    min-width: 160px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
}

.dropdown-menu a {
    display: block;
    padding: 10px 20px;
    color: white;
    text-decoration: none;
}

.dropdown-menu a:hover {
    background: rgba(255,255,255,0.06);
}

.dropdown.active .dropdown-menu {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(5px);
}
</style>
</head>

<body>

<a href="index.html" class="back">← Accueil</a>

<h1>Jogging SILENCE</h1>
<p>Confort. Fluidité. Silence.</p>

<div class="dropdown">
    <div class="dropdown-button">Mes produits</div>
    <div class="dropdown-menu">
        <a href="tshirt.html">T-shirt</a>
        <a href="pull.html">Pull</a>
        <a href="jogging.html">Jogging</a>
    </div>
</div>

<script>
const dropdown = document.querySelector('.dropdown');
const button = document.querySelector('.dropdown-button');

button.addEventListener('click', () => {
    dropdown.classList.toggle('active');
});

document.addEventListener('click', (e) => {
    if (!dropdown.contains(e.target)) {
        dropdown.classList.remove('active');
    }
});
</script>

</body>
</html>
