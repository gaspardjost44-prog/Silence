<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SILENCE – Produit</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 60px 20px;
    }

    h1 {
      font-weight: 300;
      letter-spacing: 8px;
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      letter-spacing: 4px;
      color: #777;
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    img {
      max-width: 320px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .desc {
      font-size: 16px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: #111;
      margin-bottom: 20px;
    }

    a.button-link {
      display: inline-block;
      padding: 14px 28px;
      border: none;
      background: #111;
      color: white;
      cursor: pointer;
      border-radius: 30px;
      font-size: 14px;
      letter-spacing: 1px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    a.button-link:hover {
      opacity: 0.8;
      transform: scale(1.05);
    }

    footer {
      font-size: 12px;
      color: #aaa;
      margin-top: 60px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
        letter-spacing: 4px;
      }
      .subtitle {
        font-size: 12px;
        letter-spacing: 2px;
      }
      img {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>SILENCE</h1>
    <div class="subtitle">Produit en vedette</div>

    <img src="images/tshirt.png" alt="T-shirt Silence">

    <div class="desc">
      Une pièce calme et minimaliste. Un message discret.<br>
      Conçue pour ceux qui grandissent en silence.
    </div>

    <div class="price">15 €</div>

    <a href="https://ton-site-de-panier.com" target="_blank" class="button-link">Ajouter au panier</a>

    <footer>
      © 2026 SILENCE — Tous droits réservés
    </footer>
  </div>
</body>
</html>
