<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>SILENCE – Grandir en silence</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111;
      overflow-y: auto;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 60px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-weight: 300;
      letter-spacing: 8px;
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 12px;
      letter-spacing: 4px;
      color: #777;
      margin-bottom: 60px;
      text-transform: uppercase;
    }

    img {
      max-width: 320px;
      border-radius: 12px;
      margin-bottom: 40px;
    }

    /* Image pivotée */
    .rotated {
      transform: rotate(90deg); /* tourne l'image pour qu'elle soit lisible */
    }

    .desc {
      font-size: 15px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: #111;
      margin-bottom: 20px;
    }

    .button-link {
      display: inline-block;
      padding: 14px 28px;
      border: none;
      background: #111;
      color: white;
      cursor: pointer;
      border-radius: 30px;
      font-size: 14px;
      letter-spacing: 1px;
      text-decoration: none;
      transition: all 0.3s ease;
      margin-bottom: 60px;
    }

    .button-link:hover {
      opacity: 0.8;
      transform: scale(1.05);
    }

    footer {
      font-size: 12px;
      color: #aaa;
      margin-top: 60px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
        letter-spacing: 4px;
      }
      .subtitle {
        font-size: 10px;
        letter-spacing: 2px;
      }
      img {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>SILENCE</h1>
    <div class="subtitle">Grandir en silence</div>

    <!-- Image principale du T-shirt -->
    <img src="images/tshirt.png" alt="T-shirt Silence">

    <!-- Nouvelle image pivotée -->
    <img src="images/1c030cf3-937b-4b62-989a-f4684f4a66e5.png" alt="Logo Silence" class="rotated">

    <div class="desc">
      Une pièce calme et minimaliste. Un message discret.<br>
      Conçue pour ceux qui grandissent en silence.
    </div>

    <div class="price">15 €</div>

    <a href="https://ton-site-de-panier.com" target="_blank" class="button-link">Ajouter au panier</a>

    <footer>
      © 2026 SILENCE — Tous droits réservés
    </footer>
  </div>

</body>
</html>
