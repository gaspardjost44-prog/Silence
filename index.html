<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SILENCE</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #111;
    color: #f5f5f5;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

/* TITRE */
h1 {
    font-size: 60px;
    letter-spacing: 4px;
    margin-bottom: 30px;
}

/* ===== MENU DEROULANT ===== */
.dropdown {
    position: relative;
    display: inline-block;
}

.dropdown-button {
    padding: 12px 32px;
    background: #111;
    color: white;
    border-radius: 30px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    box-shadow: 0 0 0 rgba(255,255,255,0);
}

.dropdown-button:hover {
    box-shadow: 0 0 12px rgba(255,255,255,0.4);
    transform: translateY(-2px);
}

.dropdown-menu {
    position: absolute;
    top: 120%;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
    border-radius: 15px;
    padding: 8px 0;
    min-width: 160px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    z-index: 10;
}

.dropdown-menu a {
    display: block;
    padding: 10px 20px;
    color: white;
    text-decoration: none;
    transition: background 0.3s ease;
}

.dropdown-menu a:hover {
    background: rgba(255,255,255,0.06);
}

.dropdown.active .dropdown-menu {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(5px);
}
</style>
</head>

<body>

<div>
    <h1>SILENCE</h1>

    <div class="dropdown">
        <div class="dropdown-button">Nos produits</div>
        <div class="dropdown-menu">
            <a href="tshirt.html">T-shirt</a>
            <a href="pull.html">Pull</a>
            <a href="jogging.html">Jogging</a>
        </div>
    </div>
</div>

<script>
const dropdown = document.querySelector('.dropdown');
const button = document.querySelector('.dropdown-button');

button.addEventListener('click', () => {
    dropdown.classList.toggle('active');
});

document.addEventListener('click', (e) => {
    if (!dropdown.contains(e.target)) {
        dropdown.classList.remove('active');
    }
});
</script>

</body>
</html>
