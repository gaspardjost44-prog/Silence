<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SILENCE</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #111;
    color: #f5f5f5;
    height: 100vh;
}

/* ===== NAVBAR LUXE ===== */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(17,17,17,0.9);
    backdrop-filter: blur(6px);
    z-index: 100;
}

.logo {
    font-size: 22px;
    letter-spacing: 3px;
    text-decoration: none;
    color: #f5f5f5;
}

/* MENU */
.dropdown {
    position: relative;
}

.dropdown-button {
    cursor: pointer;
    letter-spacing: 1px;
    transition: opacity 0.3s ease;
}

.dropdown-button:hover {
    opacity: 0.7;
}

.dropdown-menu {
    position: absolute;
    right: 0;
    top: 150%;
    background: #111;
    border-radius: 12px;
    padding: 8px 0;
    min-width: 160px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

.dropdown-menu a {
    display: block;
    padding: 10px 20px;
    color: white;
    text-decoration: none;
}

.dropdown-menu a:hover {
    background: rgba(255,255,255,0.05);
}

.dropdown.active .dropdown-menu {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(5px);
}

/* CONTENU */
.hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.hero h1 {
    font-size: 70px;
    letter-spacing: 6px;
    margin-bottom: 10px;
}

.hero p {
    opacity: 0.7;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <a href="index.html" class="logo">SILENCE</a>

    <div class="dropdown">
        <div class="dropdown-button">Produits</div>
        <div class="dropdown-menu">
            <a href="tshirt.html">T-shirt</a>
            <a href="pull.html">Pull</a>
            <a href="jogging.html">Jogging</a>
        </div>
    </div>
</div>

<!-- CONTENU -->
<div class="hero">
    <h1>SILENCE</h1>
    <p>Minimal. Calme. Essentiel.</p>
</div>

<script>
const dropdown = document.querySelector('.dropdown');
const button = document.querySelector('.dropdown-button');

button.addEventListener('click', () => {
    dropdown.classList.toggle('active');
});

document.addEventListener('click', (e) => {
    if (!dropdown.contains(e.target)) {
        dropdown.classList.remove('active');
    }
});
</script>

</body>
</html>
