<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SILENCE – Accueil</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111;
      overflow-x: hidden;
    }

    /* Bordure / Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 3cm; /* bordure épaisse */
      height: 100%;
      background: #111;
      display: flex;
      flex-direction: column;
      justify-content: flex-start; /* menu en haut */
      align-items: center;
      padding-top: 20px;
      box-sizing: border-box;
      color: white;
      font-size: 16px;
      letter-spacing: 2px;
    }

    .sidebar a {
      color: white;
      text-decoration: none;
      margin-bottom: 20px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .sidebar a:hover {
      opacity: 0.8;
      transform: scale(1.05);
    }

    .container {
      max-width: 900px;
      margin-left: 3cm; /* laisser place à la bordure */
      padding: 60px 20px;
      text-align: center;
    }

    h1 {
      font-weight: 300;
      letter-spacing: 8px;
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      letter-spacing: 4px;
      color: #777;
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    .desc {
      font-size: 16px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    a.button-link {
      display: inline-block;
      padding: 14px 28px;
      border: none;
      background: #111;
      color: white;
      cursor: pointer;
      border-radius: 30px;
      font-size: 14px;
      letter-spacing: 1px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    a.button-link:hover {
      opacity: 0.8;
      transform: scale(1.05);
    }

    footer {
      font-size: 12px;
      color: #aaa;
      margin-top: 60px;
    }
