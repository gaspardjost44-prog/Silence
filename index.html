<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SILENCE – Growing in silence</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 60px 20px;
      text-align: center;
    }

    h1 {
      font-weight: 300;
      letter-spacing: 8px;
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 12px;
      letter-spacing: 4px;
      color: #777;
      margin-bottom: 60px;
      text-transform: uppercase;
    }

    img {
      max-width: 320px;
      border-radius: 12px;
      margin-bottom: 40px;
    }

    .desc {
      font-size: 15px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .price {
      font-size: 18px;
      margin-bottom: 20px;
    }

    button {
      padding: 14px 28px;
      border: none;
      background: #111;
      color: white;
      cursor: pointer;
      border-radius: 30px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    button:hover {
      opacity: 0.8;
    }

    footer {
      margin-top: 100px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>SILENCE</h1>
    <div class="subtitle">Growing in silence</div>

    <img src="https://via.placeholder.com/300x400?text=Your+T-shirt" alt="Silence T-shirt">

    <div class="desc">
      A calm, minimal piece. A quiet statement.<br>
      Designed for those who grow in silence.
    </div>

    <div class="price">€29</div>

    <button>Add to cart</button>

    <footer>
      © 2026 SILENCE — All rights reserved
    </footer>
  </div>

</body>
</html>
