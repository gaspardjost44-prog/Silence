<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SILENCE – Accueil</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111;
      overflow-x: hidden;
    }

    /* Bannière latérale */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 60px;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 16px;
      letter-spacing: 2px;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .sidebar:hover {
      background: #333;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 60px 20px 60px 100px; /* laisser la place pour la sidebar */
      text-align: center;
    }

    h1 {
      font-weight: 300;
      letter-spacing: 8px;
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      letter-spacing: 4px;
      color: #777;
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    .desc {
      font-size: 16px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    a.button-link {
      display: inline-block;
      padding: 14px 28px;
      border: none;
      background: #111;
      color: white;
      cursor: pointer;
      border-radius: 30px;
      font-size: 14px;
      letter-spacing: 1px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    a.button-link:hover {
      opacity: 0.8;
      transform: scale(1.05);
    }

    footer {
      font-size: 12px;
      color: #aaa;
      margin-top: 60px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
        letter-spacing: 4px;
      }
      .subtitle {
        font-size: 12px;
        letter-spacing: 2px;
      }
      .container {
        padding-left: 60px;
      }
      .sidebar {
        width: 50px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <div class="sidebar" onclick="window.location.href='produit.html'">Produit</div>

  <div class="container">
    <h1>SILENCE</h1>
    <div class="subtitle">Grandir en silence</div>

    <div class="desc">
      Bienvenue sur SILENCE, une marque pour ceux qui aiment la simplicité et le calme. <br>
      Ici, vous pouvez présenter votre marque, votre philosophie ou tout ce que vous souhaitez écrire.
    </div>

    <a href="produit.html" class="button-link">Découvrir le produit</a>

    <footer>
      © 2026 SILENCE — Tous droits réservés
    </footer>
  </div>
</body>
</html>
